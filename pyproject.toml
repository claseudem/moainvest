[project]
name = "market-dashboard"
version = "0.1.0"
description = "Panel de precios en vivo (estilo TradingView) construido con Flask, arquitectura MVC y datos de Yahoo Finance"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudinary>=1.46.2",
    "flask>=3.1.3",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.0",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "quantstats>=0.0.81",
    "resend>=2.47.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "ta-lib>=0.8.1",
    "yfinance>=1.7.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
# Cada app tiene su carpeta en tests/ (tests/<app>/test_routes.py, ...).
addopts = "--import-mode=importlib"

[dependency-groups]
dev = [
    "pytailwindcss>=0.3.1",
    "pytest>=9.1.1",
]
